[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-skills"
version = "0.3.3"
description = "Procedural writing-style skills for AI agents — official frameworks, not vibes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.0"]
authors = [{ name = "Surendran B" }]
keywords = ["agent-skills", "writing", "writing-style", "voice", "copywriting", "opencode", "claude-code"]

[project.urls]
Homepage = "https://github.com/surendranb/writing-skills"
Repository = "https://github.com/surendranb/writing-skills"

[project.scripts]
writing-skills-mcp = "writing_skills_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_skills_mcp"]

[tool.hatch.build.targets.sdist]
[tool.hatch.build.targets.sdist.force-include]
"plugin.json" = "plugin.json"
"skills" = "skills"
"exhaustive-styles.json" = "exhaustive-styles.json"

[tool.hatch.build.targets.wheel.force-include]
"plugin.json" = "plugin.json"
"skills" = "skills"
"exhaustive-styles.json" = "exhaustive-styles.json"